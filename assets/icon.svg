<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background -->
  <rect width="1024" height="1024" fill="#0a0a0a"/>
  
  <!-- Grid representing 6x7 contact sheet -->
  <g stroke="#404040" stroke-width="2" fill="none">
    <!-- Outer border -->
    <rect x="150" y="150" width="724" height="724" stroke="#808080" stroke-width="3"/>
    
    <!-- 6 columns (5 vertical lines) -->
    <line x1="270" y1="150" x2="270" y2="874"/>
    <line x1="390" y1="150" x2="390" y2="874"/>
    <line x1="510" y1="150" x2="510" y2="874"/>
    <line x1="630" y1="150" x2="630" y2="874"/>
    <line x1="750" y1="150" x2="750" y2="874"/>
    
    <!-- 7 rows (6 horizontal lines) -->
    <line x1="150" y1="253" x2="874" y2="253"/>
    <line x1="150" y1="356" x2="874" y2="356"/>
    <line x1="150" y1="459" x2="874" y2="459"/>
    <line x1="150" y1="562" x2="874" y2="562"/>
    <line x1="150" y1="665" x2="874" y2="665"/>
    <line x1="150" y1="768" x2="874" y2="768"/>
  </g>
  
  <!-- Orange squares arranged to form the letter "C" -->
  <!-- Top row of C (row 2, cols 2-5) -->
  <rect x="272" y="255" width="116" height="99" fill="#0a0a0a" opacity="1"/>
  <rect x="392" y="255" width="116" height="99" fill="#ff6b35" opacity="0.8"/>
  <rect x="512" y="255" width="116" height="99" fill="#ff6b35" opacity="0.8"/>
  <rect x="632" y="255" width="116" height="99" fill="#ff6b35" opacity="0.8"/>
  
  <!-- Left vertical of C (rows 3-5, col 2) -->
  <rect x="272" y="358" width="116" height="99" fill="#ff6b35" opacity="0.8"/>
  <rect x="272" y="461" width="116" height="99" fill="#ff6b35" opacity="0.8"/>
  <rect x="272" y="564" width="116" height="99" fill="#ff6b35" opacity="0.8"/>
  
  <!-- Bottom row of C (row 6, cols 2-5) -->
  <rect x="272" y="667" width="116" height="99" fill="#0a0a0a" opacity="1"/>
  <rect x="392" y="667" width="116" height="99" fill="#ff6b35" opacity="0.8"/>
  <rect x="512" y="667" width="116" height="99" fill="#ff6b35" opacity="0.8"/>
  <rect x="632" y="667" width="116" height="99" fill="#ff6b35" opacity="0.8"/>
</svg>
